<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRIAD</title>
<style>
:root{--bg:#050b10;--card:#0d1720;--card2:#101e29;--line:#20303b;--txt:#f4f8fb;--muted:#94a7b5;--blue:#169bff;--cyan:#35d4ff;--ok:#31d3a2;--warn:#ffb24a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#02070b,#07131b);color:var(--txt);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding:18px 16px 96px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;font-size:21px}.brand b{color:var(--blue)}.muted{color:var(--muted)}h1{font-size:28px;margin:6px 0}h2{font-size:20px;margin:10px 0}.card{background:linear-gradient(145deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.hero{min-height:190px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(180deg,transparent,#08121a),radial-gradient(circle at 70% 20%,#18435d,#0a141c 55%)}.tag{display:inline-block;background:#12344b;color:#9ddcff;border-radius:999px;padding:5px 9px;font-size:12px;margin-right:5px}.btn{width:100%;border:0;border-radius:13px;padding:14px;font-weight:800;font-size:15px;background:var(--blue);color:white;cursor:pointer}.btn.secondary{background:#132532;border:1px solid #2b4659}.btn.ghost{background:transparent;border:1px solid #2b4659}.row{display:flex;gap:10px}.row>*{flex:1}.workout{cursor:pointer}.workout strong{font-size:18px}.exercise{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center}.eximg{height:86px;border-radius:13px;background:linear-gradient(135deg,#172b38,#0a1117);display:grid;place-items:center;overflow:hidden;border:1px solid #29404f}.eximg svg{width:78px;height:70px;stroke:#dbe8ef;stroke-width:4;fill:none;stroke-linecap:round}.mini{font-size:12px;color:var(--muted)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;background:#071018ee;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 12px}.nav button{flex:1;background:none;border:0;color:var(--muted);padding:8px;font-size:12px}.nav button.active{color:var(--blue)}.screen{display:none}.screen.active{display:block}.back{background:none;border:0;color:white;font-size:24px;padding:0 12px 0 0}.setbox{display:grid;grid-template-columns:1fr 1fr;gap:10px}.setbox label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;margin-top:5px;background:#071119;color:white;border:1px solid #2b4659;border-radius:10px;padding:12px;font-size:16px}.counter{display:flex;align-items:center;justify-content:space-between;font-size:34px;font-weight:900}.counter button{width:48px;height:48px;border-radius:50%;border:0;background:#173041;color:white;font-size:24px}.timer{font-size:52px;font-weight:900;text-align:center;margin:24px 0}.progress{height:9px;background:#162631;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue);width:55%}.choice{border:1px solid #29404f;border-radius:14px;padding:14px;margin:9px 0;cursor:pointer}.choice.on{border-color:var(--blue);background:#0d2940}.chart{height:150px;display:flex;align-items:flex-end;gap:8px}.chart i{flex:1;background:linear-gradient(var(--cyan),var(--blue));border-radius:6px 6px 0 0}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.on{display:flex}.modalbox{max-width:460px;width:100%;background:#0b1720;border:1px solid #29404f;border-radius:20px;padding:18px}.demo{height:250px;border-radius:15px;background:#071018;display:grid;place-items:center}.demo svg{width:220px;height:190px;stroke:#fff;stroke-width:5;fill:none;stroke-linecap:round}.pulse{animation:pulse 1.4s infinite}@keyframes pulse{50%{transform:translateY(-15px)}}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#133346;border:1px solid #2d5a73;border-radius:12px;padding:10px 15px;display:none;z-index:30}.toast.on{display:block}@media(max-width:380px){.exercise{grid-template-columns:76px 1fr}.eximg{height:74px}.app{padding-left:12px;padding-right:12px}}
.exphoto{width:100%;height:100%;object-fit:cover;display:block}.demoGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pose{background:#071018;border:1px solid #29404f;border-radius:14px;overflow:hidden}.pose img{width:100%;display:block;aspect-ratio:1/1;object-fit:cover}.pose b{display:block;padding:8px;text-align:center;font-size:12px}.credit{font-size:11px;color:var(--muted);text-align:center;margin-top:10px}@media(max-width:380px){.demoGrid{grid-template-columns:1fr 1fr}}

.exercise{display:block}.exhead{display:flex;align-items:center;gap:8px}.exhead b{font-size:17px}.infoBtn{margin-left:auto;width:30px;height:30px;border-radius:50%;border:1px solid #315269;background:#102330;color:#bfe8ff;font-weight:900;font-family:serif;font-size:16px;cursor:pointer}.prescription{margin:4px 0 12px;color:var(--muted);font-size:13px}.series{display:grid;gap:7px}.seriesRow{display:grid;grid-template-columns:32px 1fr 1fr 58px 36px;gap:6px;align-items:center}.seriesRow span{font-size:12px;color:var(--muted);font-weight:800}.seriesRow input,.seriesRow select{margin:0;padding:9px 6px;font-size:14px;text-align:center}.seriesRow button{height:36px;border-radius:9px;border:1px solid #315269;background:#102330;color:#8ea4b2;font-weight:900}.seriesRow button.done{background:#123c32;color:#56e4b6;border-color:#246a57}.seriesLabels{display:grid;grid-template-columns:32px 1fr 1fr 58px 36px;gap:6px;margin-bottom:2px}.seriesLabels span{font-size:10px;color:#718896;text-align:center}.seriesLabels span:first-child{text-align:left}.exercisePreview{width:100%;height:120px;object-fit:cover;border-radius:12px;margin:10px 0 12px;border:1px solid #29404f;background:#071018}.surfHero{position:relative;overflow:hidden;background:#071018}.surfHero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#061018 10%,rgba(6,16,24,.76) 55%,rgba(6,16,24,.18));z-index:1}.surfHero>*{position:relative;z-index:2}.surfPhoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.72}.heroPhotoNote{font-size:11px;color:#9fb1bd}.workoutIntro{margin-bottom:14px}.demo{height:auto;min-height:230px;padding:8px}
</style></head>
<body><div class="toast" id="toast"></div><main class="app" id="app"></main>
<nav class="nav"><button data-go="home" class="active">⌂<br>Início</button><button data-go="training">◉<br>Treino</button><button data-go="progress">▥<br>Progresso</button><button data-go="more">☰<br>Mais</button></nav>
<div class="modal" id="modal"><div class="modalbox"><div class="top"><b id="modalTitle">Execução</b><button class="back" id="closeModal">×</button></div><div class="demo" id="demo"></div><p id="demoText" class="muted"></p><button class="btn" id="closeDemo">Entendi</button></div></div>
<script>
const svg=(type='pull')=> type==='legs'?'<svg viewBox="0 0 100 80"><circle cx="50" cy="12" r="7"/><path d="M50 20v25m0-15L30 42m20-12 20 12M50 45 32 68m18-23 18 23M22 70h56"/></svg>':type==='push'?'<svg viewBox="0 0 100 80"><circle cx="50" cy="15" r="7"/><path d="M50 23v28M50 31 24 25M50 31l26-6M50 51 35 72m15-21 15 21M18 22h64"/></svg>':type==='core'?'<svg viewBox="0 0 100 80"><circle cx="24" cy="30" r="7"/><path d="M31 33 58 42l24 3M47 39 38 57m20-15 13 18M16 65h70"/></svg>':'<svg viewBox="0 0 100 80"><circle cx="50" cy="15" r="7"/><path d="M50 23v30M50 30 30 12M50 30 70 12M50 53 35 73m15-20 15 20M20 8h60"/></svg>';
const repdbBase='https://exercise-dataset.com/images/flat/';
const exerciseIds={
'Barra fixa pronada':'pull-up','Hack squat':'hack-squat','Supino reto barra':'barbell-bench-press','Remada baixa / cavalinho':'seated-cable-row','Supino inclinado halteres':'incline-dumbbell-bench-press','Elevação lateral':'dumbbell-lateral-raise','Panturrilha em pé':'standing-calf-raise','Rosca direta':'barbell-curl','Tríceps polia':'cable-tricep-pushdown','Ab wheel':'ab-wheel-rollout',
'Dips / paralelas':'chest-dip','Hip thrust':'barbell-hip-thrust','Puxada alta neutra':'neutral-grip-lat-pulldown','Chest press':'machine-chest-press','Leg press':'leg-press','Mesa flexora':'lying-leg-curl','Rosca martelo':'dumbbell-hammer-curl','Tríceps francês polia':'cable-overhead-tricep-extension','Face pull':'cable-face-pull','Panturrilha sentada':'seated-calf-raise','Pallof press':'cable-pallof-press',
'Box jump':'box-jump','Barra fixa neutra':'neutral-grip-pull-up','Flexão':'push-up','Goblet squat':'dumbbell-goblet-squat','Remada unilateral':'one-arm-dumbbell-row','Flexora unilateral':'single-leg-lying-leg-curl','Landmine press unilateral':'single-arm-landmine-press','Rosca na polia':'cable-bicep-curl','Tríceps corda':'rope-tricep-pushdown','Panturrilha':'standing-calf-raise','Suitcase carry':'dumbbell-suitcase-carry'};
function imgUrl(name,pose){const id=exerciseIds[name];return id?repdbBase+id+'-'+pose+'.webp':''}
function exPhoto(name,pose='start'){const u=imgUrl(name,pose);return u?'<img class="exphoto" src="'+u+'" alt="'+name+' — '+(pose==='start'?'posição inicial':'posição final')+'" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'"><span style="display:none">'+svg('pull')+'</span>':svg('pull')}
const workouts={
A:{title:'A · Segunda',sub:'Força + Tensão',ex:[
['Barra fixa pronada','4 × 5–8','Costas · Calistenia','pull'],['Hack squat','3 × 6–8','Pernas','legs'],['Supino reto barra','3 × 5–7','Peito','push'],['Remada baixa / cavalinho','3 × 8–10','Costas','pull'],['Supino inclinado halteres','3 × 8–10','Peito','push'],['Elevação lateral','3 × 10–15','Deltoides','push'],['Panturrilha em pé','3 × 8–12','Panturrilhas','legs'],['Rosca direta','2 × 8–12','Bíceps','pull'],['Tríceps polia','2 × 8–12','Tríceps','push'],['Ab wheel','2 × 6–12','Core','core']]},
B:{title:'B · Quarta',sub:'Hipertrofia',ex:[
['Dips / paralelas','3 × 6–10','Peito · Calistenia','push'],['Hip thrust','3 × 6–8','Glúteos','legs'],['Puxada alta neutra','3 × 8–12','Costas','pull'],['Chest press','3 × 8–12','Peito','push'],['Leg press','3 × 10–12','Pernas','legs'],['Mesa flexora','3 × 10–12','Posteriores','legs'],['Rosca martelo','3 × 10–12','Bíceps','pull'],['Tríceps francês polia','3 × 10–12','Tríceps','push'],['Face pull','2 × 12–15','Deltoides','pull'],['Panturrilha sentada','3 × 12–15','Panturrilhas','legs'],['Pallof press','2 × 10–12/lado','Core','core']]},
C:{title:'C · Sexta',sub:'Atlético + Condicionamento',ex:[
['Box jump','3 × 4','Potência','legs'],['Barra fixa neutra','3 × 6–10','Costas · Calistenia','pull'],['Flexão','3 × 10–20','Peito · Calistenia','push'],['Goblet squat','3 × 8–10','Pernas','legs'],['Remada unilateral','3 × 8–12','Costas','pull'],['Flexora unilateral','3 × 10–12','Posteriores','legs'],['Landmine press unilateral','3 × 8–10','Deltoides','push'],['Rosca na polia','2 × 10–15','Bíceps','pull'],['Tríceps corda','2 × 10–15','Tríceps','push'],['Panturrilha','2 × 12–15','Panturrilhas','legs'],['Suitcase carry','2 × 30–40m/lado','Core','core']]}}
let state={screen:'home',workout:'A',ex:0,reps:8,load:0,rir:2,surf:null,timer:null,secs:30,round:1,logs:JSON.parse(localStorage.getItem('triadLogs')||'[]')};
const app=document.getElementById('app'),toast=document.getElementById('toast');
function notify(t){toast.textContent=t;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),1600)}
function header(title,back){return '<div class="top">'+(back?'<button class="back" data-back>‹</button>':'<div class="brand">TRI<b>AD</b></div>')+'<span class="muted">'+title+'</span></div>'}
function home(){return header('Semana 1')+'<div class="card hero"><span class="tag">TREINO DE HOJE</span><h1>SEGUNDA</h1><b>Força + Tensão</b><p class="muted">~55–60 min · Full body</p><button class="btn" data-open="A">Iniciar treino</button></div><div class="card workout" data-surf><b>🏄 Surf amanhã?</b><p class="muted">'+(state.surf===null?'Não definido':state.surf?'Sim · modo pré-surf':'Não · treino normal')+'</p></div><div class="card"><b>Seu progresso</b><div class="row" style="margin-top:12px"><div><h2>3</h2><span class="mini">Treinos</span></div><div><h2>'+state.logs.length+'</h2><span class="mini">Séries registradas</span></div><div><h2>5h52</h2><span class="mini">Tempo total</span></div></div></div>'}
function training(){return header('Escolha do treino')+Object.entries(workouts).map(([k,w])=>'<div class="card workout" data-open="'+k+'"><span class="tag">'+k+'</span><h2>'+w.title+'</h2><b>'+w.sub+'</b><p class="muted">'+(k==='A'?'Força, movimentos compostos e estabilidade.':k==='B'?'Volume, controle e forma.':'Potência, calistenia, core e condicionamento.')+'</p></div>').join('')}
function setCount(txt){let m=txt.match(/^(\d+)/);return m?+m[1]:3}
function rirTarget(name){if(state.workout==='C'&&state.surf&&['Goblet squat','Flexora unilateral','Panturrilha'].includes(name))return 3;if(['Box jump'].includes(name))return 3;return 2}
function seriesRows(e,i){let n=setCount(e[1]),rows='';for(let s=1;s<=n;s++){let old=state.logs.find(x=>x.w===state.workout&&x.e===i&&x.set===s)||{};rows+='<div class="seriesRow"><span>S'+s+'</span><input inputmode="numeric" type="number" min="0" placeholder="—" value="'+(old.reps??'')+'" data-field="reps" data-i="'+i+'" data-set="'+s+'"><input inputmode="decimal" type="number" min="0" step=".5" placeholder="kg" value="'+(old.load??'')+'" data-field="load" data-i="'+i+'" data-set="'+s+'"><select data-field="rir" data-i="'+i+'" data-set="'+s+'">'+[3,2,1,0].map(v=>'<option '+((old.rir??rirTarget(e[0]))==v?'selected':'')+'>'+v+'</option>').join('')+'</select><button class="'+(old.done?'done':'')+'" data-done="'+i+'" data-set="'+s+'">'+(old.done?'✓':'○')+'</button></div>'}return rows}
function workout(){let w=workouts[state.workout];return header(w.title,true)+'<div class="workoutIntro"><h1>'+w.sub+'</h1><p class="muted">'+(state.workout==='C'&&state.surf?'Modo pré-surf ativo · fadiga de pernas reduzida.':'Registre cada série diretamente na ficha. Toque em ⓘ para ver a execução.')+'</p></div>'+w.ex.map((e,i)=>'<div class="card exercise"><div class="exhead"><b>'+e[0]+'</b><button class="infoBtn" data-demo="'+i+'" aria-label="Informações sobre '+e[0]+'">i</button></div><div class="prescription">'+e[1]+' · '+e[2]+' · RIR '+rirTarget(e[0])+'</div><div class="seriesLabels"><span></span><span>REPS</span><span>CARGA</span><span>RIR</span><span></span></div><div class="series">'+seriesRows(e,i)+'</div></div>').join('')+(state.workout==='C'?'<button class="btn" data-conditioning>Iniciar condicionamento</button>':'')}
function log(){let e=workouts[state.workout].ex[state.ex];return header('Registro de série',true)+'<div class="card"><div class="eximg" style="height:190px">'+exPhoto(e[0],'start')+'</div><h1>'+e[0]+'</h1><p class="muted">'+e[1]+'</p><div class="counter"><button data-minus="reps">−</button><span id="reps">'+state.reps+'</span><button data-plus="reps">+</button></div><p class="mini" style="text-align:center">repetições</p><div class="setbox"><label>Carga adicional (kg)<input id="load" type="number" min="0" step="0.5" value="'+state.load+'"></label><label>RIR<select id="rir"><option>3</option><option selected>2</option><option>1</option><option>0</option></select></label></div><button class="btn" style="margin-top:14px" data-save>Salvar série</button></div>'}
function surf(){return header('Ajuste de sexta',true)+'<h1>Vai surfar amanhã?</h1><p class="muted">O treino de sexta muda para preservar desempenho no mar.</p><div class="choice '+(state.surf===true?'on':'')+'" data-surfchoice="yes"><b>✓ Sim · modo pré-surf</b><p class="muted">RIR mais alto, menor fadiga e condicionamento opcional.</p></div><div class="choice '+(state.surf===false?'on':'')+'" data-surfchoice="no"><b>Não · treino normal</b><p class="muted">Volume e intensidade padrão.</p></div><button class="btn" data-go="training">Continuar</button>'}
function conditioning(){return header('Condicionamento',true)+'<div class="row"><button class="btn '+(state.mode==='climb'?'secondary':'')+'" data-mode="row">Remo</button><button class="btn '+(state.mode==='climb'?'':'secondary')+'" data-mode="climb">Escalada</button></div><div class="card"><p class="muted" style="text-align:center">HIIT 30/30 · 6 min</p><div class="timer" id="timer">'+String(state.secs).padStart(2,'0')+'</div><div style="text-align:center"><b>'+(state.round%2?'FORTE':'LEVE')+'</b><p class="muted">Bloco '+state.round+' de 12</p></div><button class="btn" data-timer>'+(state.timer?'Pausar':'Iniciar')+'</button></div>'}
function progress(){return header('Progresso')+'<h1>Meu progresso</h1><div class="card"><b>Força · últimas semanas</b><div class="chart"><i style="height:35%"></i><i style="height:42%"></i><i style="height:48%"></i><i style="height:55%"></i><i style="height:58%"></i><i style="height:67%"></i><i style="height:76%"></i><i style="height:86%"></i></div></div><div class="card"><b>Calistenia · Barra fixa</b><h2>Nível 1 · peso corporal</h2><div class="progress"><i></i></div><p class="muted">Meta inicial: 4 × 8 limpas. Depois, progressão com carga.</p></div>'}
function more(){return header('Mais')+'<div class="card"><h2>Configurações</h2><p class="muted">Cronômetro com aviso sonoro: ativo</p><button class="btn secondary" data-reset>Limpar sessão</button></div><div class="card"><b>Créditos de exercícios</b><p class="muted">Exercise data & illustrations by RepDB (repdb.co).</p></div><div class="card"><b>Sobre o método</b><p class="muted">Full body 3× por semana, força + hipertrofia + calistenia + condicionamento, com ajuste pré-surf.</p></div>'}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.go===state.screen));app.innerHTML=state.screen==='home'?home():state.screen==='training'?training():state.screen==='workout'?workout():state.screen==='log'?log():state.screen==='surf'?surf():state.screen==='conditioning'?conditioning():state.screen==='progress'?progress():more();bind()}
function bind(){app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{state.workout=b.dataset.open;state.screen='workout';render()});app.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{state.screen=state.screen==='log'||state.screen==='conditioning'?'workout':'training';render()});app.querySelectorAll('[data-demo]').forEach(b=>b.onclick=()=>showDemo(+b.dataset.demo));let s=app.querySelector('[data-surf]');if(s)s.onclick=()=>{state.screen='surf';render()};app.querySelectorAll('[data-surfchoice]').forEach(b=>b.onclick=()=>{state.surf=b.dataset.surfchoice==='yes';render()});let c=app.querySelector('[data-conditioning]');if(c)c.onclick=()=>{state.screen='conditioning';state.secs=30;state.round=1;render()};app.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{state.reps++;render()});app.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{state.reps=Math.max(0,state.reps-1);render()});let save=app.querySelector('[data-save]');if(save)save.onclick=()=>{state.load=Math.max(0,+document.getElementById('load').value||0);state.rir=+document.getElementById('rir').value;state.logs.push({w:state.workout,e:state.ex,reps:state.reps,load:state.load,rir:state.rir});notify('Série salva ✓');state.screen='workout';render()};app.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{let i=+b.dataset.done,s=+b.dataset.set,card=b.closest('.seriesRow'),reps=card.querySelector('[data-field="reps"]').value,load=card.querySelector('[data-field="load"]').value,rir=+card.querySelector('[data-field="rir"]').value;let idx=state.logs.findIndex(x=>x.w===state.workout&&x.e===i&&x.set===s);let item={w:state.workout,e:i,set:s,reps:reps===''?null:+reps,load:load===''?null:+load,rir,done:true};if(idx>=0)state.logs[idx]=item;else state.logs.push(item);localStorage.setItem('triadLogs',JSON.stringify(state.logs));notify('Série salva ✓');render()});let t=app.querySelector('[data-timer]');if(t)t.onclick=toggleTimer;app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.mode=b.dataset.mode;render()});let reset=app.querySelector('[data-reset]');if(reset)reset.onclick=()=>{state.logs=[];localStorage.removeItem('triadLogs');notify('Sessão limpa');render()}}
function showDemo(i){let e=workouts[state.workout].ex[i],a=imgUrl(e[0],'start'),b=imgUrl(e[0],'peak');document.getElementById('modalTitle').textContent=e[0]+' · execução';document.getElementById('demo').innerHTML='<div class="demoGrid"><div class="pose"><img src="'+a+'" alt="Posição inicial" onerror="this.parentElement.innerHTML=\'<b>Imagem específica em revisão</b>\'"><b>Posição inicial</b></div><div class="pose"><img src="'+b+'" alt="Posição final" onerror="this.parentElement.innerHTML=\'<b>Imagem específica em revisão</b>\'"><b>Posição final</b></div></div>';document.getElementById('demoText').innerHTML='Compare as duas posições antes da série. Mantenha controle, amplitude confortável e a técnica prescrita.<div class="credit">Exercise data & illustrations by RepDB</div>';document.getElementById('modal').classList.add('on')}
function beep(){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=740;g.gain.value=.08;o.start();o.stop(a.currentTime+.12)}catch(e){}}
function toggleTimer(){if(state.timer){clearInterval(state.timer);state.timer=null;render();return}state.timer=setInterval(()=>{state.secs--;if(state.secs<=0){beep();state.round++;state.secs=30;if(state.round>12){clearInterval(state.timer);state.timer=null;state.round=12;notify('Condicionamento concluído ✓')}}let el=document.getElementById('timer');if(el)el.textContent=String(state.secs).padStart(2,'0')},1000);render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{if(state.timer){clearInterval(state.timer);state.timer=null}state.screen=b.dataset.go;render()});document.getElementById('closeModal').onclick=document.getElementById('closeDemo').onclick=()=>document.getElementById('modal').classList.remove('on');render();
</script></body></html>
